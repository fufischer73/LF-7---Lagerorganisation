            - {titel: "LS66: Aufgabenauswahl nach Niveau und Zusatzaufgaben"}
            - {titel: "LS66 - Lösungen Teil 2"}
        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 2 (LS66)"}
