        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS68, die Lösungen und die Zusatzaufgaben (Nutzwertanalyse, Erklärvideo, CO2 beim Transport). Zu den Aufgaben 8 bis 11 (Warenbegleit- und Warenwertpapiere) gibt es ein Info-Blatt und ein Arbeitsblatt.

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
            - {titel: "LS68: Aufgaben aus dem Arbeitsheft (Seiten 113 bis 116)"}
