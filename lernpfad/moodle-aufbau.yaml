      - systematisierung:
          titel: "Systematisierung: Kosten, Kennzahlen, Transport (Strukturlegetechnik)"
          text: |
            Ordnen Sie mit Karten die Rechenwege und Zusammenhänge aus LS66, LS67 und LS68 (analog, ohne Computer). Das Strukturbild hilft Ihnen bei der Vorbereitung der Klassenarbeit.
          links:
            - {titel: "Systematisierung: Anleitung und Begriffe"}
      - textfeld:
          titel: "Klassenarbeit 1: Überblick und Vorbereitung"
          text: |
            Die Klassenarbeit 1 bezieht sich auf LS66, LS67 und LS68. Hier finden Sie Themen, wichtige Formeln und Tipps zur Vorbereitung.
          links:
