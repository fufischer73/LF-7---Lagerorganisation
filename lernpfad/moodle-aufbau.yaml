        text: "Lagerkennzahlen berechnen und deuten. Buch: Lernfeld 7, Kapitel 2.6 (Seiten 98 bis 107)."
        links:
          - {titel: "LS67: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Die Lagerhaltung mithilfe von Kennzahlen verbessern"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 5 der Lernsituation. Sie benötigen die Lagerdateien, die Arbeitsblätter 67.1 und 67.2 und das Buchkapitel.
          links:
            - {titel: "LS67: Aufgaben und Arbeitsblätter"}
        loesungen:
          links:
            - {titel: "LS67 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS67, die Lösungen und die Zusatzaufgaben (Kennzahlen-Tabelle, Fachartikel zu Festplatz- und Freiplatzsystem, Kennzahlen im Betrieb).

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben. Die Bestandserfassung und Inventur kennen Sie aus Lernfeld 5.
