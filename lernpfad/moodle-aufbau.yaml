# Aufbau des Moodle-Kurses im Stil der Lernfeld-Kurse (siehe skripte/moodle_lf.py im Lernpfad-Baukasten).
# Fehlende Nextcloud-Links bleiben leer (url:) und stehen nach dem Bauen in ausgabe/moodle/LINKS_ausfuellen.md.

kurs:
  titel: "Industriekaufleute: Lernfeld 7"
  kurzname: lf7-logistik
  abschnitt: "Lernfeld 7: Logistik- und Lagerprozesse koordinieren, umsetzen und überwachen (40 Std.)"
  text: Lieferkette, Lager, Nachhaltigkeit, Entsorgung und Transport bei der Fly Bike Werke GmbH.

advance_organizer:
  html: material/advance-organizer.html
  links:
    - {titel: "Inhaltliche Orientierung: Übersicht LF7", icon: orientierung}
    - {titel: "Selbsteinschätzung LF7 (Kann-Liste)", icon: kannliste}
    - {titel: "Vorlage Punktekonto LF7"}
    - {titel: "Wochenplan LF7"}
    - titel: "KI-Assistent Logistik- und Lagerprozesse (LF7)"
      icon: orientierung
      text: "Dieser Link führt Sie zu einem KI-Assistenten, der Sie bei den Lernsituationen 64 bis 70 unterstützt. Er gibt Hinweise und stellt Rückfragen, löst aber nicht Ihre Aufgaben. Geben Sie keine persönlichen Daten oder Betriebsgeheimnisse ein."

bloecke:
  - titel: "Block I: Logistik- und Lagerkonzept (LS64 - LS65)"
    anfang:
      - textfeld:
          titel: "Handlungsprodukt 1: Der Auftrag der Geschäftsleitung"
          text: |
            Die Fly Bike Werke GmbH wächst. Frau Nowak bittet die Logistikabteilung um ein Logistik- und Lagerkonzept als Entscheidungsvorlage, bevor in ein neues Lager investiert wird.

            In Block I erarbeiten Sie im Team (3 bis 4 Personen) Schritt für Schritt drei Teile: A Lieferkette, B Lagerplanung, C Verknüpfung und Empfehlung. Das Handlungsprodukt ist die Grundlage für das Fachgespräch nach Block II.
          links:
            - {titel: "Handlungsprodukt 1: Auftrag und Hinweise"}
    lernsituationen:
      - id: ls64
        titel: "LS64 - Ein Logistikkonzept erstellen"
        text: "Lieferketten und Supply-Chain-Management bei der Fly Bike Werke GmbH. Buch: Lernfeld 7, Kapitel 1.1, 1.2 und 1.3.3 (Seiten 74 bis 79)."
        links:
          - {titel: "LS64: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Ein Logistikkonzept erstellen"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 4 der Lernsituation. Sie benötigen die Arbeitsblätter 64.1 und 64.2 und die Buchkapitel. Ihre Ergebnisse sind Teil A des Handlungsprodukts 1.
          links:
            - {titel: "LS64: Aufgaben und Arbeitsblätter"}
        loesungen:
          links:
            - {titel: "LS64 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS64, die Lösungen und die Zusatzaufgaben (Info-Blatt zu Just-in-Time und Just-in-Sequence, Lieferkette und Verantwortung).

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
            - {titel: "LS64: Aufgaben aus dem Arbeitsheft (Seiten 77 bis 79)"}
            - {titel: "LS64: Aufgabenauswahl nach Niveau und Zusatzaufgaben"}
            - {titel: "LS64 - Lösungen Teil 2"}
          zusatz:
            - {titel: "Info-Blatt 4.2: Just-in-Time vs. Just-in-Sequence"}
        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben Kapitel 1. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 1"}
      - id: ls65
        titel: "LS65 - Die Lagerhaltung planen"
        text: "Ein neues Lager für die Fly Bike Werke GmbH planen. Buch: Lernfeld 7, Kapitel 2.1 bis 2.4 und 2.3.4 (Seiten 80 bis 88)."
        links:
          - {titel: "LS65: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Die Lagerhaltung planen"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 5 der Lernsituation. Sie benötigen die Arbeitsblätter 65.1 bis 65.3 und die Buchkapitel. Ihre Ergebnisse sind Teil B des Handlungsprodukts 1.
          links:
            - {titel: "LS65: Aufgaben und Arbeitsblätter"}
          zusatz:
            - {titel: "Fachartikel: Erfolgsfaktor Kommissionierung (Die Großhandelskaufleute 03/2021)"}
        loesungen:
          links:
            - {titel: "LS65 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS65, die Lösungen und die Zusatzaufgaben (Standorte der Lager, Lagerlayout, nachhaltige Lagerplanung).

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
            - {titel: "LS65: Aufgaben aus dem Arbeitsheft (Seiten 84 bis 88)"}
            - {titel: "LS65: Aufgabenauswahl nach Niveau und Zusatzaufgaben"}
            - {titel: "LS65 - Lösungen Teil 2"}
          zusatz:
            - {titel: "Fachartikel: Erfolgsfaktor Kommissionierung (Aufgaben dazu in der Aufgabenauswahl)"}
        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben Kapitel 2. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 2"}
    abschluss:
      - systematisierung:
          titel: "Systematisierung: Von der Lieferkette zum Lager (Strukturlegetechnik)"
          text: |
            Legen Sie aus den Begriffen von LS64 und LS65 mit Karten ein Strukturbild. Das machen wir analog, ohne Computer. Danach verbinden Sie Lieferkette und Lager in Teil C Ihres Handlungsprodukts.
          links:
            - {titel: "Systematisierung: Anleitung und Begriffe"}
      - reflexion:
          titel: "Zwischenreflexion Block I"
          text: |
            Nehmen Sie sich 10 Minuten: Was hat gut geklappt? Was ist noch unklar? Welche Kann-Aussagen sitzen? Was nehmen Sie für Block II mit?
          links:
            - {titel: "Zwischenreflexion Block I: Leitfragen"}

  - titel: "Block II: Nachhaltigkeits- und Entsorgungskonzept (LS70 - LS69)"
    anfang:
      - textfeld:
          titel: "Handlungsprodukt 2: Einladung zum Meeting"
          text: |
            Die Fly Bike Werke GmbH hat Nachhaltigkeit in ihrer Strategie verankert, jetzt rückt die Logistik in den Mittelpunkt. Herr Thüne lädt zum Meeting ein: Aus den Ideen sollen konkrete Handlungsstrategien und ein ganzheitliches Entsorgungskonzept werden, das auch die Mitarbeitenden einbindet.

            In Block II erarbeiten Sie im Team drei Teile: A Nachhaltigkeitsmaßnahmen, B Entsorgungskonzept, C Wirkung und Nachhaltigkeitsziele (SDG 6 und 11). Am Ende stellen Sie das Konzept im Meeting vor. Handlungsprodukt 1 und 2 sind die Grundlage für das Fachgespräch.
          links:
            - {titel: "Handlungsprodukt 2: Auftrag und Hinweise"}
    lernsituationen:
      - id: ls70
        titel: "LS70 - Für Sicherheit und Nachhaltigkeit in der Logistik sorgen"
        text: "Ideen für eine nachhaltige Logistik sammeln und priorisieren, Sicherheit im Lager. Buch: Lernfeld 7, Kapitel 5.3 (Seiten 126 bis 134)."
        links:
          - {titel: "LS70: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Sicherheit und Nachhaltigkeit in der Logistik"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 4 der Lernsituation (Ideen sammeln, priorisieren, Meeting vorbereiten). Sie benötigen die Arbeitsblätter 70.1 bis 70.4 und das Buchkapitel. Ihre Ergebnisse sind Teil A des Handlungsprodukts 2.
          links:
            - {titel: "LS70: Aufgaben und Arbeitsblätter"}
        loesungen:
          links:
            - {titel: "LS70 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS70 (Sicherheitszeichen, Gefahrstoffe, Ergonomie, Unfälle, Datenschutz), die Lösungen und die Zusatzaufgaben. Die BNE-Aufgabe zu Nachhaltigkeitsziel 11 (Stadtlogistik, letzte Meile) gehört dazu.

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
            - {titel: "LS70: Aufgaben aus dem Arbeitsheft (Seiten 132 bis 134)"}
            - {titel: "LS70: Aufgabenauswahl nach Niveau und Zusatzaufgaben (BNE SDG 11)"}
            - {titel: "LS70 - Lösungen Teil 2"}
        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben Kapitel 5. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 5"}
      - id: ls69
        titel: "LS69 - Ein Entsorgungskonzept erstellen"
        text: "Ein ganzheitliches Entsorgungskonzept für die Fly Bike Werke GmbH. Buch: Lernfeld 7, Kapitel 4.1 bis 4.3 (Seiten 117 bis 125)."
        links:
          - {titel: "LS69: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Ein Entsorgungskonzept erstellen"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 6 der Lernsituation. Sie benötigen das Arbeitsblatt 69.1 (vier Blätter) und das Buchkapitel. Ihre Ergebnisse sind Teil B des Handlungsprodukts 2.
          links:
            - {titel: "LS69: Aufgaben und Arbeitsblätter"}
        loesungen:
          links:
            - {titel: "LS69 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS69, die Lösungen und die Zusatzaufgaben. Die BNE-Aufgabe zu Nachhaltigkeitsziel 6 (Sauberes Wasser, Lacke und Gewässerschutz) gehört dazu.

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
            - {titel: "LS69: Aufgaben aus dem Arbeitsheft (Seiten 123 bis 125)"}
            - {titel: "LS69: Aufgabenauswahl nach Niveau und Zusatzaufgaben (BNE SDG 6)"}
            - {titel: "LS69 - Lösungen Teil 2"}
        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben Kapitel 4. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 4"}
    abschluss:
      - systematisierung:
          titel: "Systematisierung: Nachhaltigkeit und Entsorgung (Strukturlegetechnik)"
          text: |
            Legen Sie aus den Begriffen von LS70 und LS69 mit Karten ein Strukturbild (analog, ohne Computer). Ordnen Sie auch die Nachhaltigkeitsziele 6 und 11 ein und halten Sie das Ergebnis für Teil C Ihres Handlungsprodukts fest.
          links:
            - {titel: "Systematisierung: Anleitung und Begriffe"}
      - textfeld:
          titel: "Meeting: Handlungsprodukt 2 vorstellen"
          text: |
            Stellen Sie Ihr Konzept im Meeting (Rollenspiel) vor. Verteilen Sie Rollen wie Geschäftsführung, Logistik, Produktion, Betriebsrat, Verwaltung. Am Ende entscheidet das Meeting, welche Maßnahmen umgesetzt werden.
      - zertifizierung:
          titel: "Zertifizierung - Terminwahl für das Fachgespräch zu HP 1 und HP 2"
          text: |
            Tragen Sie sich in die TaskCard ein, sobald Sie Block II bearbeitet haben. Verschieben Sie dazu die Kachel mit Ihrem Namen in die gewünschte Spalte. Sobald ein Termin mit 3 bis 4 Schülerinnen und Schülern belegt ist, beginnen wir mit dem Fachgespräch.
      - textfeld:
          titel: "Fachgespräch: Ablauf und Kriterien"
          links:
            - {titel: "Zertifizierung: Ablauf und Kriterien des Fachgesprächs"}
      - reflexion:
          titel: "Reflexion und Feedback Block II"
          text: |
            Nehmen Sie sich nach dem Fachgespräch 15 Minuten: Was lief gut? Was ist noch unklar? Wie hängen Lieferkette, Lager, Nachhaltigkeit und Entsorgung zusammen? Welchen Beitrag leistet die Logistik zu den Nachhaltigkeitszielen 6 und 11?
          links:
            - {titel: "Reflexion Block II: Leitfragen"}

  - titel: "Block III: Kosten, Kennzahlen, Transport (LS66 - LS68)"
    anfang:
      - textfeld:
          titel: "Block III: Überblick"
          text: |
            In Block III rechnen und entscheiden Sie: Eigen- oder Fremdlager (LS66), Lagerkennzahlen (LS67) und die passende Transportform (LS68). Es gibt kein Handlungsprodukt, der Block endet mit der Klassenarbeit 1.

            Die Rechenwege (kritische Lagerfläche, Kennzahlen, kritische Entfernung) üben Sie im Lernatelier. In der Systematisierung ordnen Sie Rechenwege und Zusammenhänge mit der Strukturlegetechnik.
    lernsituationen:
      - id: ls66
        titel: "LS66 - Zwischen Eigen- und Fremdlager entscheiden"
        text: "Kosten von Eigen- und Fremdlager vergleichen, kritische Lagerfläche ermitteln, Lagervertrag und Lagerschein. Buch: Lernfeld 7, Kapitel 2.4.3 (Seiten 89 bis 97)."
        links:
          - {titel: "LS66: Lernsituation und Arbeitsblätter"}
        orientierung: {titel: "Inhaltliche Orientierung: Zwischen Eigen- und Fremdlager entscheiden"}
        kokreativ:
          text: |
            Bearbeiten Sie im Team die Arbeitsaufträge 1 bis 3 der Lernsituation. Sie benötigen die Arbeitsblätter 66.1 (Kostenvergleich) und 66.2 (Vertragsverhältnisse) und das Buchkapitel.
          links:
            - {titel: "LS66: Aufgaben und Arbeitsblätter"}
        loesungen:
          links:
            - {titel: "LS66 - Lösungen Teil 1"}
        lernatelier:
          text: |
            Hier finden Sie die Aufgaben zur LS66, die Lösungen und die Zusatzaufgaben (Kostenvergleich in der Tabellenkalkulation, Entscheidungsvorlage, Nachhaltigkeit).

            Hinweis: Bearbeiten Sie nicht alle Aufgaben, sondern üben Sie gezielt die Themen, bei denen Sie Bedarf haben.
          links:
