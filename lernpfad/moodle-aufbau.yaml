      - id: ls68
        titel: "LS68 - Die geeignete Transportform auswählen"
        text: "Transportform wählen, Kosten ermitteln, Frachtbrief und Rechtsbeziehungen. Buch: Lernfeld 7, Kapitel 3.2 (Seiten 108 bis 116)."
        links:
          - {titel: "LS68: Lernsituation und Arbeitsblätter"}
