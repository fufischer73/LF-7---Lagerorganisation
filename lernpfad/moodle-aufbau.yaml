          text: |
            Nehmen Sie sich nach der Klassenarbeit 15 Minuten: Was hat in der Vorbereitung gut funktioniert? Welche Rechenwege sitzen, welche nicht? Was nehmen Sie aus dem Lernfeld 7 mit?
          links:
            - {titel: "Reflexion Block III: Leitfragen"}
