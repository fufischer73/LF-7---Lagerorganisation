        verarbeitung:
          text: "Hier finden Sie die Lösungen zu den Alles-klar-Aufgaben Kapitel 3. Prüfen Sie danach Ihre Kann-Liste."
          links:
            - {titel: "Lösungen Alles-klar-Aufgaben Kapitel 3"}
